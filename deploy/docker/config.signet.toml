# wick-server config — default signet via mempool.space public Esplora.
#
# No local bitcoind or electrs required; chain data comes from the public API.
# Postgres must be running:
#   just postgres-up
#   cargo run --bin wick-server -- --config deploy/docker/config.signet.toml
#
# IMPORTANT: never commit a real mnemonic to version control.
# Inject the seed via environment variable instead:
#   export WICK_SERVER_MNEMONIC="word1 word2 ... word24"
# Or replace server_mnemonic below with a freshly-generated phrase:
#   python -c "from mnemonic import Mnemonic; print(Mnemonic('english').generate(256))"
#
# Other secrets can be injected the same way:
#   WICK_DATABASE_URL      — DB connection string with real credentials
#   WICK_LISTEN_PORT_BASE  — override P2P port allocation
#   WICK_GRPC_ADDR         — e.g. 0.0.0.0:50051 for non-localhost access

database_url        = "postgres://wick:wick@localhost:5432/wick"
max_db_connections  = 16
metrics_addr        = "127.0.0.1:9464"
grpc_addr           = "127.0.0.1:50051"
memory_budget_bytes = 536870912   # 512 MiB
network             = "signet"
# esplora_url omitted — defaults to https://mempool.space/signet/api

# OS assigns a random port per tenant. Set a non-zero base (e.g. 19735) if
# you need stable inbound addresses that survive park/wake cycles.
listen_port_base    = 0

# Replace with a real mnemonic or use WICK_SERVER_MNEMONIC (see above).
server_mnemonic     = "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"

# ── Phase-2 park/wake tuning (all optional — defaults shown) ─────────────────
# Uncomment and override as needed.
#
# [park_wake]
# wake_deadline_secs              = 2      # max wall-clock time for one wake
# activity_poll_interval_secs     = 30     # how often the idle poller ticks
# idle_threshold_secs             = 300    # 5 min idle before park candidate
# max_error_attempts              = 5      # failures before ERROR state
# error_recovery_interval_secs    = 60     # recovery probe interval
# memory_evictor_interval_secs    = 10     # evictor tick interval
# lru_eviction_threshold          = 0.80   # pressure to start LRU eviction
# emergency_eviction_threshold    = 0.95   # pressure for force-park
# evictor_target_pressure         = 0.70   # pressure target after eviction
