# wick-server dev config — mutinynet (30-second blocks, no local daemon required).
#
# Default network for local development. Chain data comes from the public
# mutinynet.com Esplora; only Postgres needs to be running locally.
#
#   just postgres-up
#   cargo run --bin wick-server
#
# To use local regtest instead, point WICK_CONFIG at config.regtest.toml.
#
# All fields can be overridden by WICK_* environment variables:
#   WICK_SERVER_MNEMONIC   — inject seed without editing this file
#   WICK_DATABASE_URL      — inject DB credentials
#   WICK_LISTEN_PORT_BASE  — override P2P port allocation
#   WICK_GRPC_ADDR         — e.g. 0.0.0.0:50051 for non-localhost access

database_url        = "postgres://wick:wick@localhost:5432/wick"
max_db_connections  = 16
metrics_addr        = "127.0.0.1:9464"
grpc_addr           = "127.0.0.1:50051"
memory_budget_bytes = 536870912   # 512 MiB
network             = "mutinynet"
# esplora_url omitted — defaults to https://mutinynet.com/api

# OS assigns a random port per tenant on each boot. Avoids conflicts with any
# local Lightning software on 9735. Set a non-zero base (e.g. 19735) if you
# need stable inbound addresses across park/wake cycles.
listen_port_base    = 0

# Canonical BIP39 zero-entropy phrase — dev-only, never deploy.
# Override without editing this file: WICK_SERVER_MNEMONIC="word1 word2 ..."
server_mnemonic     = "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"

# ── Phase-2 park/wake tuning (all optional — defaults shown) ─────────────────
# Uncomment and override for staging chaos runs or latency profiling.
#
# [park_wake]
# wake_deadline_secs              = 2      # max wall-clock time for one wake
# activity_poll_interval_secs     = 30     # how often the idle poller ticks
# idle_threshold_secs             = 300    # 5 min idle before park candidate
# max_error_attempts              = 5      # failures before ERROR state
# error_recovery_interval_secs    = 60     # recovery probe interval
# memory_evictor_interval_secs    = 10     # evictor tick interval
# lru_eviction_threshold          = 0.80   # pressure to start LRU eviction
# emergency_eviction_threshold    = 0.95   # pressure for force-park
# evictor_target_pressure         = 0.70   # pressure target after eviction
