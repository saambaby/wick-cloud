# wick-server config — mutinynet (custom signet, 30-second blocks).
#
# No local bitcoind or electrs required; chain data comes from mutinynet.com.
# Postgres must be running:
#   just postgres-up
#   cargo run --bin wick-server -- --config deploy/docker/config.mutinynet.toml
#
# Phase-4: tenant Lightning keys live exclusively in the SDK. The server
# holds NO seed material; each tenant's SDK opens a `SignerService.Attach`
# bidi gRPC stream and serves every signer call locally.
#
# Secrets injected via environment variables:
#   WICK_DATABASE_URL      — DB connection string with real credentials
#   WICK_LISTEN_PORT_BASE  — override P2P port allocation
#   WICK_GRPC_ADDR         — e.g. 0.0.0.0:50051 for non-localhost access

database_url        = "postgres://wick:wick@localhost:5432/wick"
max_db_connections  = 16
metrics_addr        = "127.0.0.1:9464"
grpc_addr           = "127.0.0.1:50051"
memory_budget_bytes = 536870912   # 512 MiB
network             = "mutinynet"
# esplora_url omitted — defaults to https://mutinynet.com/api

# OS assigns a random port per tenant. Set a non-zero base (e.g. 19735) if
# you need stable inbound addresses that survive park/wake cycles.
listen_port_base    = 0

# ── Phase-2 park/wake tuning ─────────────────────────────────────────────────
# Live-network wake on first boot includes RGS sync (~700ms), ChannelManager
# restore from PgKvStore, and a Noise+VLS round-trip to the SDK signer for
# every keys-derive. The 2s default is too tight; 30s gives slow-start
# tenants room without being abusive.
[park_wake]
wake_deadline_secs              = 90
# activity_poll_interval_secs     = 30     # how often the idle poller ticks
# idle_threshold_secs             = 300    # 5 min idle before park candidate
# max_error_attempts              = 5      # failures before ERROR state
# error_recovery_interval_secs    = 60     # recovery probe interval
# memory_evictor_interval_secs    = 10     # evictor tick interval
# lru_eviction_threshold          = 0.80   # pressure to start LRU eviction
# emergency_eviction_threshold    = 0.95   # pressure for force-park
# evictor_target_pressure         = 0.70   # pressure target after eviction

# ── Phase-3 LSP daemon (operator role) ──────────────────────────────────────
# Disabled by default. Self-custodial design: the server holds NO
# on-chain seed and NO LSP Lightning seed. All seed material lives in
# the operator's SDK process running on a trusted machine.
#
# To enable:
#   1. Set lsp.enabled = true below.
#   2. From the operator's machine, derive the LSP pubkey offline using
#      the *same* BIP39 mnemonic that backs the operator's BDK wallet
#      (domain-separated BIP32 path `m/13037'/coin'/0'` keeps it
#      independent of the on-chain receive descriptors):
#         use wick_sdk::compute_operator_lsp_pubkey;
#         let pk = compute_operator_lsp_pubkey(MNEMONIC, None, WickNetwork::Mutinynet)?;
#         println!("[lsp].pubkey_hex = {}", pk);
#      Paste the result into `pubkey_hex` below.
#   3. Set `WICK_ADMIN_SECRET=<random>` on the server side. The operator
#      SDK passes the same secret as the `x-wick-admin-secret` header.
#   4. Top up the operator's BDK wallet via the mutinynet faucet so JIT
#      channels can be funded:
#         operator.next_funding_address()  // BIP84 P2WPKH
#   5. After the server boots, the operator runs:
#         operator.register_lsp().await?;       // installs seed in-memory
#         wick_sdk::run_funding_loop(&mut operator).await?;
#
# [lsp]
# enabled              = true
# listen_addr          = "0.0.0.0:19836"
# upstream_peer        = ""                   # empty = WickNetwork::default_lsp_upstream (Mutiny hub)
# min_fee_msat         = 2000
# proportional_ppm     = 7000
# reorg_reserve_sats   = 1000000
# max_jit_channel_sats = 5000000
# min_payment_size_msat = 100000
# max_payment_size_msat = 100000000000
# cltv_expiry_delta    = 144
# jit_fulfil_timeout_blocks = 40
# pubkey_hex           = "<33-byte hex>"      # output of compute_operator_lsp_pubkey(...)

# Active config for the JIT integration test
# (`tenant_to_tenant_jit_payment_mutinynet`). `pubkey_hex` is the LSP
# Lightning pubkey derived from `FAUCET_MNEMONIC` (committed in
# integration_mutinynet.rs) via `compute_operator_lsp_pubkey(...,
# WickNetwork::Mutinynet)`. The printer test
# `print_operator_lsp_pubkey_for_mutinynet` re-emits it on demand if
# the mnemonic changes. Boot the server with
# `WICK_ADMIN_SECRET=jit-mutinynet-secret`; the operator role inside the
# test passes the same value via the `x-wick-admin-secret` header.
[lsp]
enabled                   = true
listen_addr               = "0.0.0.0:19836"
upstream_peer             = ""
min_fee_msat              = 2000
proportional_ppm          = 7000
reorg_reserve_sats        = 1000000
max_jit_channel_sats      = 5000000
min_payment_size_msat     = 100000
max_payment_size_msat     = 100000000000
cltv_expiry_delta         = 144
jit_fulfil_timeout_blocks = 40
pubkey_hex                = "0255a219a8406ea07b93d976261553d974ea54723dd251642a9e2efccaddccbabd"
