[package]
name = "wick-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Canonical Rust SDK for Wick Cloud. Phase 5."

[lints]
workspace = true

[features]
default = ["std"]
std = []
ffi = []
wasm = []
# Regtest helpers — bitcoind JSON-RPC client + polling utilities for
# local dev workflows. Off by default; never built into a production SDK.
regtest = ["dep:bitcoincore-rpc"]

[dependencies]
wick-core      = { workspace = true }
wick-proto     = { workspace = true }
thiserror      = { workspace = true }
tonic          = { workspace = true }
prost          = { workspace = true }
tokio          = { workspace = true }
tokio-stream   = { workspace = true }
tracing        = { workspace = true }
hex            = { workspace = true }
parking_lot    = { workspace = true }
async-trait    = { workspace = true }

# keys / BIP39
bip39          = { workspace = true }
bitcoin        = { workspace = true }
secp256k1      = { workspace = true }
zeroize        = { workspace = true }

# on-chain wallet + chain
bdk_wallet     = { workspace = true }
bdk_esplora    = { workspace = true }
esplora-client = { workspace = true }

# optional — only enabled by the `regtest` feature
bitcoincore-rpc = { workspace = true, optional = true }

[dev-dependencies]
tokio             = { workspace = true, features = ["macros", "rt-multi-thread", "process"] }
rand              = { workspace = true }
lightning         = { workspace = true }
lightning-invoice = { workspace = true }
# Parity test verifies SDK's offline LSP-pubkey derivation matches
# `wick_lightning::from_seed` server-side (see `operator::tests`).
wick-lightning    = { workspace = true }

[[test]]
name = "regtest_flow"
path = "tests/regtest_flow.rs"
required-features = ["regtest"]

[[test]]
name = "jit_flow"
path = "tests/jit_flow.rs"
required-features = ["regtest"]
