syntax = "proto3";

package wick;

option java_multiple_files = true;
option java_package = "cloud.wick.v1";

// WalletService is the primary gRPC surface for the wick-server.
// Phase 1: tenant management + balance/payment stubs.
// Phase 3+: real LDK-backed implementations.
service WalletService {
  // CreateTenant provisions a new wallet tenant.
  // Returns the tenant_id which identifies this wallet in all subsequent calls.
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse);

  // GetBalance returns the current Lightning + on-chain balance for a tenant.
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);

  // SendPayment initiates an outbound payment for a tenant.
  rpc SendPayment(SendPaymentRequest) returns (SendPaymentResponse);

  // ReceivePayment creates a BOLT11 invoice for a tenant.
  rpc ReceivePayment(ReceivePaymentRequest) returns (ReceivePaymentResponse);

  // GetTransactions returns paginated payment history for a tenant.
  rpc GetTransactions(GetTransactionsRequest) returns (GetTransactionsResponse);

  // GetNodeInfo returns the tenant's Lightning node pubkey and listen address.
  // Required by other clients who want to ConnectPeer to this tenant.
  rpc GetNodeInfo(GetNodeInfoRequest) returns (GetNodeInfoResponse);

  // ConnectPeer establishes a persistent P2P connection to a Lightning peer.
  rpc ConnectPeer(ConnectPeerRequest) returns (ConnectPeerResponse);

  // OpenChannelInit starts an outbound channel open and returns the
  // funding output script + channel value so the client can build a
  // funding tx from its own BDK wallet. Two-phase self-custodial flow:
  // call Init, build+sign tx on the client side, call Finalize with the
  // signed tx.
  rpc OpenChannelInit(OpenChannelInitRequest) returns (OpenChannelInitResponse);

  // OpenChannelFinalize completes an outbound channel open by handing
  // LDK a pre-signed funding transaction. The temp_channel_id must match
  // the one returned from a prior OpenChannelInit.
  rpc OpenChannelFinalize(OpenChannelFinalizeRequest) returns (OpenChannelFinalizeResponse);

  // ListChannels returns a snapshot of the tenant's current channels.
  rpc ListChannels(ListChannelsRequest) returns (ListChannelsResponse);
}

// ── CreateTenant ─────────────────────────────────────────────────────────────

message CreateTenantRequest {
  // The Lightning pubkey (33-byte compressed SEC1, hex-encoded) of the wallet.
  string pubkey_hex = 1;

  // Subscription plan tier: "free" | "standard" | "premium".
  string plan_tier = 2;
}

message CreateTenantResponse {
  // Assigned tenant ID (UUID string). Stable across re-registrations with
  // the same pubkey.
  string tenant_id = 1;

  // Opaque bearer token for this tenant. Present exactly once at registration;
  // never re-issued. Include in all subsequent requests as:
  //   Authorization: Bearer <token>
  // Phase 4 replaces this with a macaroon (architecture §5.4).
  string api_token = 2;
}

// ── GetBalance ────────────────────────────────────────────────────────────────

message GetBalanceRequest {
  uint64 tenant_id = 1;
}

message GetBalanceResponse {
  // Spendable Lightning balance in millisatoshis.
  uint64 lightning_balance_msat = 1;

  // Confirmed on-chain balance in satoshis.
  uint64 onchain_balance_sats = 2;
}

// ── SendPayment ───────────────────────────────────────────────────────────────

message SendPaymentRequest {
  uint64 tenant_id = 1;

  // BOLT11 invoice to pay.
  string bolt11 = 2;
}

message SendPaymentResponse {
  // 32-byte payment hash.
  bytes payment_hash = 1;

  // Routing fee paid in millisatoshis.
  uint64 fee_paid_msat = 2;

  // "succeeded" | "failed" | "pending"
  string status = 3;
}

// ── ReceivePayment ────────────────────────────────────────────────────────────

message ReceivePaymentRequest {
  uint64 tenant_id = 1;

  // Amount in millisatoshis. Omit for any-amount invoice.
  optional uint64 amount_msat = 2;

  // Human-readable memo / description.
  string memo = 3;
}

message ReceivePaymentResponse {
  // BOLT11 invoice string.
  string bolt11 = 1;

  // 32-byte payment hash.
  bytes payment_hash = 2;
}

// ── GetTransactions ───────────────────────────────────────────────────────────

message GetTransactionsRequest {
  uint64 tenant_id = 1;

  // Maximum number of records to return (default 50, max 200).
  uint32 limit = 2;

  // If set, return only payments created before this Unix timestamp (cursor pagination).
  optional int64 before_timestamp = 3;
}

message GetTransactionsResponse {
  repeated Payment payments = 1;
}

message Payment {
  // 32-byte payment hash.
  bytes payment_hash = 1;

  // true = outbound (sent), false = inbound (received).
  bool is_outbound = 2;

  // Amount in millisatoshis.
  uint64 amount_msat = 3;

  // Fee in millisatoshis (0 for inbound).
  uint64 fee_msat = 4;

  // "pending" | "succeeded" | "failed"
  string status = 5;

  // Unix timestamp (seconds) when the payment was created.
  int64 timestamp = 6;

  // Optional memo attached to the invoice.
  optional string memo = 7;
}

// ── GetNodeInfo ───────────────────────────────────────────────────────────────

message GetNodeInfoRequest {
  uint64 tenant_id = 1;  // unused — auth header carries identity
}

message GetNodeInfoResponse {
  // 33-byte compressed SEC1 pubkey of the tenant's LDK node, hex-encoded.
  string node_id_hex = 1;

  // Host the P2P listener bound to (typically 127.0.0.1 on regtest).
  string listen_host = 2;

  // Port the P2P listener bound to. Zero means the node has no listener.
  uint32 listen_port = 3;
}

// ── ConnectPeer ───────────────────────────────────────────────────────────────

message ConnectPeerRequest {
  uint64 tenant_id = 1;

  // 33-byte compressed SEC1 pubkey of the peer, hex-encoded.
  string peer_pubkey_hex = 2;

  // Peer host (IP address or hostname).
  string host = 3;

  // Peer TCP port.
  uint32 port = 4;
}

message ConnectPeerResponse {}

// ── OpenChannelInit ───────────────────────────────────────────────────────────

message OpenChannelInitRequest {
  uint64 tenant_id = 1;

  // Peer pubkey hex. Must already be connected via ConnectPeer.
  string peer_pubkey_hex = 2;

  // Channel capacity in satoshis.
  uint64 channel_value_sat = 3;

  // Amount pushed to the counterparty at open time (millisatoshis).
  uint64 push_msat = 4;
}

message OpenChannelInitResponse {
  // 32-byte temporary_channel_id — opaque handle for OpenChannelFinalize.
  bytes temp_channel_id = 1;

  // 2-of-2 multisig scriptPubKey the funding tx must pay to. Hex-encoded
  // raw script bytes.
  string funding_output_script_hex = 2;

  // Exact amount (sats) the funding tx must pay to funding_output_script.
  uint64 channel_value_sat = 3;
}

// ── OpenChannelFinalize ───────────────────────────────────────────────────────

message OpenChannelFinalizeRequest {
  uint64 tenant_id = 1;

  // Temp channel id returned from OpenChannelInit.
  bytes temp_channel_id = 2;

  // Peer pubkey hex (same value passed to OpenChannelInit).
  string peer_pubkey_hex = 3;

  // Hex-encoded serialised bitcoin::Transaction paying `channel_value_sat`
  // to the `funding_output_script` from the init response.
  string funding_tx_hex = 4;
}

message OpenChannelFinalizeResponse {}

// ── ListChannels ──────────────────────────────────────────────────────────────

message ListChannelsRequest {
  uint64 tenant_id = 1;
}

message ListChannelsResponse {
  repeated ChannelSummary channels = 1;
}

message ChannelSummary {
  // 32-byte channel id.
  bytes channel_id = 1;

  // 33-byte compressed SEC1 pubkey of the counterparty, hex-encoded.
  string counterparty_pubkey_hex = 2;

  // Total channel capacity in satoshis.
  uint64 capacity_sat = 3;

  // Local outbound capacity in millisatoshis.
  uint64 outbound_capacity_msat = 4;

  // Remote balance available to receive in millisatoshis.
  uint64 inbound_capacity_msat = 5;

  // `true` once the channel is funded, confirmed, and ready for payments.
  bool is_usable = 6;
}
