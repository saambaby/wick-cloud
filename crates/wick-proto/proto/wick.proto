syntax = "proto3";

package wick;

option java_multiple_files = true;
option java_package = "cloud.wick.v1";

// WalletService is the primary gRPC surface for the wick-server.
// Phase 1: tenant management + balance/payment stubs.
// Phase 3+: real LDK-backed implementations.
service WalletService {
  // RegisterChallenge issues a single-use nonce the SDK must sign before
  // calling CreateTenant. Closes the token-rotation hole where any
  // caller who knew a tenant's pubkey could rotate its bearer token.
  // The nonce expires 60 seconds after issue and is consumed on first
  // successful CreateTenant. Last-writer-wins on duplicate challenges
  // for the same pubkey.
  rpc RegisterChallenge(RegisterChallengeRequest) returns (RegisterChallengeResponse);

  // CreateTenant provisions a new wallet tenant. Requires a fresh
  // nonce + ECDSA signature obtained via RegisterChallenge — proves
  // the caller controls the secp256k1 secret key for `pubkey`.
  // Returns the tenant_id which identifies this wallet in all subsequent calls.
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse);

  // GetBalance returns the current Lightning + on-chain balance for a tenant.
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);

  // SendPayment initiates an outbound payment for a tenant.
  rpc SendPayment(SendPaymentRequest) returns (SendPaymentResponse);

  // ReceivePayment creates a BOLT11 invoice for a tenant.
  rpc ReceivePayment(ReceivePaymentRequest) returns (ReceivePaymentResponse);

  // GetTransactions returns paginated payment history for a tenant.
  rpc GetTransactions(GetTransactionsRequest) returns (GetTransactionsResponse);

  // GetNodeInfo returns the tenant's Lightning node pubkey and listen address.
  // Required by other clients who want to ConnectPeer to this tenant.
  rpc GetNodeInfo(GetNodeInfoRequest) returns (GetNodeInfoResponse);

  // ConnectPeer establishes a persistent P2P connection to a Lightning peer.
  rpc ConnectPeer(ConnectPeerRequest) returns (ConnectPeerResponse);

  // OpenChannelInit starts an outbound channel open and returns the
  // funding output script + channel value so the client can build a
  // funding tx from its own BDK wallet. Two-phase self-custodial flow:
  // call Init, build+sign tx on the client side, call Finalize with the
  // signed tx.
  rpc OpenChannelInit(OpenChannelInitRequest) returns (OpenChannelInitResponse);

  // OpenChannelFinalize completes an outbound channel open by handing
  // LDK a pre-signed funding transaction. The temp_channel_id must match
  // the one returned from a prior OpenChannelInit.
  rpc OpenChannelFinalize(OpenChannelFinalizeRequest) returns (OpenChannelFinalizeResponse);

  // ListChannels returns a snapshot of the tenant's current channels.
  rpc ListChannels(ListChannelsRequest) returns (ListChannelsResponse);

  // CloseChannel cooperatively closes a channel by `channel_id`. The
  // counterparty pubkey must match the one carried on the channel.
  // Phase-4: closing-tx signing round-trips through VLS over
  // `SignerService::Attach`; the on-chain refund lands on the
  // server-side `OutputSweeperSync` change destination if one is
  // wired (see project gotchas — Phase 4 promises this routes to
  // client BDK addresses; current builder leaves the destination
  // unwired so refunds materialise as `lightning_balance().onchain_sats`).
  rpc CloseChannel(CloseChannelRequest) returns (CloseChannelResponse);

  // GetLspInfo returns the operator-mode LSP's pubkey + listen address
  // so SDK clients can connect their tenant Node directly. Server-mode
  // deployments without an LSP enabled return an empty pubkey.
  rpc GetLspInfo(GetLspInfoRequest) returns (GetLspInfoResponse);

  // Lsps2GetInfo negotiates the LSPS2 `lsps2.get_info` flow with the
  // configured LSP and returns a fee quote. Use this to display a fee
  // preview before issuing a JIT-enabled invoice.
  rpc Lsps2GetInfo(Lsps2GetInfoRequest) returns (Lsps2GetInfoResponse);

  // GetJitInvoice issues a JIT-enabled BOLT11 invoice end-to-end.
  // Internally negotiates `lsps2.get_info` + `lsps2.buy` then embeds
  // the LSP's intercept SCID as a private route hint in the invoice.
  rpc GetJitInvoice(GetJitInvoiceRequest) returns (GetJitInvoiceResponse);

  // RotateCredential mints a fresh macaroon under the same root key /
  // scope as the supplied (currently-valid) old macaroon. The old
  // macaroon's nonce is added to the global revocation set with a 30s
  // TTL grace, so in-flight RPCs finish but replays fail. Returns the
  // new macaroon bytes and its server-derived expiry. D3 M3.
  rpc RotateCredential(RotateCredentialRequest) returns (RotateCredentialResponse);
}

// ── RegisterChallenge ────────────────────────────────────────────────────────

message RegisterChallengeRequest {
  // 33-byte compressed SEC1 secp256k1 pubkey the caller wants to register.
  bytes pubkey = 1;
}

message RegisterChallengeResponse {
  // 32 random bytes the caller must sign and submit alongside
  // CreateTenantRequest within 60s. Single-use: consumed on first
  // successful CreateTenant.
  bytes nonce = 1;
}

// ── CreateTenant ─────────────────────────────────────────────────────────────

message CreateTenantRequest {
  // The Lightning pubkey (33-byte compressed SEC1, hex-encoded) of the wallet.
  string pubkey_hex = 1;

  // Subscription plan tier: "free" | "standard" | "premium".
  string plan_tier = 2;

  // Nonce previously issued by RegisterChallenge for this pubkey. Must
  // match an outstanding (un-consumed, non-expired) nonce.
  bytes nonce = 3;

  // DER-encoded ECDSA signature over
  // `sha256(b"wick-tenant-register" || nonce)` produced by the secret
  // key matching `pubkey_hex`.
  bytes signature = 4;

  // Phase-4 D1 N2 — 32-byte Curve25519 Noise static public key the SDK
  // will present on every `SignerService.Attach` stream. Optional for
  // back-compat with pre-N2 clients; tenants without a registered pk
  // bypass the Noise_KK tunnel and fall back to the legacy bearer-only
  // attach. New clients MUST send this so the server can authenticate
  // future signer streams under mutual-auth.
  bytes noise_static_pk = 5;
}

message CreateTenantResponse {
  // Assigned tenant ID (UUID string). Stable across re-registrations with
  // the same pubkey.
  string tenant_id = 1;

  // Opaque bearer token for this tenant. Present exactly once at registration;
  // never re-issued. Include in all subsequent requests as:
  //   Authorization: Bearer <token>
  // Phase 4 replaces this with a macaroon (architecture §5.4).
  // Transitional: retained alongside `macaroon` until D3 M5 retires it.
  string api_token = 2;

  // D3 M3 — server-issued user-scoped macaroon. If non-empty, new SDK
  // builds prefer this over `api_token`. The macaroon carries the same
  // tenant identity as `tenant_id` (Scope::User { tenant_id }) and a
  // 24-hour Expiry caveat. The SDK auto-rotates via `RotateCredential`
  // before the expiry.
  bytes macaroon = 3;
}

// ── GetBalance ────────────────────────────────────────────────────────────────

message GetBalanceRequest {
  uint64 tenant_id = 1;
}

message GetBalanceResponse {
  // Spendable Lightning balance in millisatoshis.
  uint64 lightning_balance_msat = 1;

  // Confirmed on-chain balance in satoshis.
  uint64 onchain_balance_sats = 2;
}

// ── SendPayment ───────────────────────────────────────────────────────────────

message SendPaymentRequest {
  uint64 tenant_id = 1;

  // BOLT11 invoice to pay.
  string bolt11 = 2;
}

message SendPaymentResponse {
  // 32-byte payment hash.
  bytes payment_hash = 1;

  // Routing fee paid in millisatoshis.
  uint64 fee_paid_msat = 2;

  // "succeeded" | "failed" | "pending"
  string status = 3;
}

// ── ReceivePayment ────────────────────────────────────────────────────────────

message ReceivePaymentRequest {
  uint64 tenant_id = 1;

  // Amount in millisatoshis. Omit for any-amount invoice.
  optional uint64 amount_msat = 2;

  // Human-readable memo / description.
  string memo = 3;
}

message ReceivePaymentResponse {
  // BOLT11 invoice string.
  string bolt11 = 1;

  // 32-byte payment hash.
  bytes payment_hash = 2;
}

// ── GetTransactions ───────────────────────────────────────────────────────────

message GetTransactionsRequest {
  uint64 tenant_id = 1;

  // Maximum number of records to return (default 50, max 200).
  uint32 limit = 2;

  // If set, return only payments created before this Unix timestamp (cursor pagination).
  optional int64 before_timestamp = 3;
}

message GetTransactionsResponse {
  repeated Payment payments = 1;
}

message Payment {
  // 32-byte payment hash.
  bytes payment_hash = 1;

  // true = outbound (sent), false = inbound (received).
  bool is_outbound = 2;

  // Amount in millisatoshis.
  uint64 amount_msat = 3;

  // Fee in millisatoshis (0 for inbound).
  uint64 fee_msat = 4;

  // "pending" | "succeeded" | "failed"
  string status = 5;

  // Unix timestamp (seconds) when the payment was created.
  int64 timestamp = 6;

  // Optional memo attached to the invoice.
  optional string memo = 7;
}

// ── GetNodeInfo ───────────────────────────────────────────────────────────────

message GetNodeInfoRequest {
  uint64 tenant_id = 1;  // unused — auth header carries identity
}

message GetNodeInfoResponse {
  // 33-byte compressed SEC1 pubkey of the tenant's LDK node, hex-encoded.
  string node_id_hex = 1;

  // Host the P2P listener bound to (typically 127.0.0.1 on regtest).
  string listen_host = 2;

  // Port the P2P listener bound to. Zero means the node has no listener.
  uint32 listen_port = 3;
}

// ── ConnectPeer ───────────────────────────────────────────────────────────────

message ConnectPeerRequest {
  uint64 tenant_id = 1;

  // 33-byte compressed SEC1 pubkey of the peer, hex-encoded.
  string peer_pubkey_hex = 2;

  // Peer host (IP address or hostname).
  string host = 3;

  // Peer TCP port.
  uint32 port = 4;
}

message ConnectPeerResponse {}

// ── OpenChannelInit ───────────────────────────────────────────────────────────

message OpenChannelInitRequest {
  uint64 tenant_id = 1;

  // Peer pubkey hex. Must already be connected via ConnectPeer.
  string peer_pubkey_hex = 2;

  // Channel capacity in satoshis.
  uint64 channel_value_sat = 3;

  // Amount pushed to the counterparty at open time (millisatoshis).
  uint64 push_msat = 4;
}

message OpenChannelInitResponse {
  // 32-byte temporary_channel_id — opaque handle for OpenChannelFinalize.
  bytes temp_channel_id = 1;

  // 2-of-2 multisig scriptPubKey the funding tx must pay to. Hex-encoded
  // raw script bytes.
  string funding_output_script_hex = 2;

  // Exact amount (sats) the funding tx must pay to funding_output_script.
  uint64 channel_value_sat = 3;
}

// ── OpenChannelFinalize ───────────────────────────────────────────────────────

message OpenChannelFinalizeRequest {
  uint64 tenant_id = 1;

  // Temp channel id returned from OpenChannelInit.
  bytes temp_channel_id = 2;

  // Peer pubkey hex (same value passed to OpenChannelInit).
  string peer_pubkey_hex = 3;

  // Hex-encoded serialised bitcoin::Transaction paying `channel_value_sat`
  // to the `funding_output_script` from the init response.
  string funding_tx_hex = 4;
}

message OpenChannelFinalizeResponse {}

// ── ListChannels ──────────────────────────────────────────────────────────────

message ListChannelsRequest {
  uint64 tenant_id = 1;
}

message ListChannelsResponse {
  repeated ChannelSummary channels = 1;
}

message ChannelSummary {
  // 32-byte channel id.
  bytes channel_id = 1;

  // 33-byte compressed SEC1 pubkey of the counterparty, hex-encoded.
  string counterparty_pubkey_hex = 2;

  // Total channel capacity in satoshis.
  uint64 capacity_sat = 3;

  // Local outbound capacity in millisatoshis.
  uint64 outbound_capacity_msat = 4;

  // Remote balance available to receive in millisatoshis.
  uint64 inbound_capacity_msat = 5;

  // `true` once the channel is funded, confirmed, and ready for payments.
  bool is_usable = 6;
}

// ── CloseChannel ──────────────────────────────────────────────────────────────

message CloseChannelRequest {
  uint64 tenant_id = 1;

  // 32-byte channel id of the channel to close.
  bytes channel_id = 2;

  // 33-byte compressed SEC1 counterparty pubkey hex. Must match the
  // counterparty stored on the channel; otherwise LDK rejects.
  string counterparty_pubkey_hex = 3;

  // If true, broadcast the latest local commitment tx unilaterally
  // (force-close). Required when in-flight HTLCs prevent a cooperative
  // close. Funds become spendable after the channel's `to_self_delay`
  // (LDK default ~144 blocks).
  bool force = 4;
}

message CloseChannelResponse {}

// ── LSP / LSPS2 (Phase 3) ─────────────────────────────────────────────────────

message GetLspInfoRequest {}

message GetLspInfoResponse {
  // 33-byte compressed SEC1 pubkey of the in-process LSP, hex-encoded.
  // Empty string if no LSP is enabled on this server.
  string lsp_pubkey_hex = 1;

  // LSP listen host:port pair (e.g. "0.0.0.0:19836"). Empty when LSP is disabled.
  string lsp_address = 2;

  // `true` when the LSP daemon is enabled, has a fresh upstream peer
  // connection, and has at least `min_jit_payment_size_msat` worth of
  // routing liquidity.
  bool ready = 3;
}

message Lsps2GetInfoRequest {
  // Requested payment size in msat. Optional — leave unset to fetch
  // the LSP's full menu without size filtering.
  optional uint64 amount_msat = 1;
}

message Lsps2GetInfoResponse {
  // 33-byte LSP pubkey hex.
  string lsp_pubkey_hex = 1;
  // Floor opening fee charged on the JIT channel.
  uint64 min_fee_msat = 2;
  // Proportional fee (parts-per-million of payment size).
  uint32 proportional_ppm = 3;
  // Minimum payment size the LSP will accept (msat).
  uint64 min_payment_size_msat = 4;
  // Maximum payment size the LSP will accept (msat).
  uint64 max_payment_size_msat = 5;
  // Quote expiry as Unix seconds.
  int64 valid_until_unix = 6;
}

message GetJitInvoiceRequest {
  // Required. LSPS2 buy needs a payment size to quote the opening fee.
  uint64 amount_msat = 1;
  // Human-readable invoice description.
  string memo = 2;
}

message GetJitInvoiceResponse {
  // BOLT11 invoice with the LSP intercept SCID embedded as a private
  // route hint.
  string bolt11 = 1;

  // 32-byte payment hash from the BOLT11.
  bytes payment_hash = 2;

  // Quoted opening fee (msat) the LSP will deduct from the first
  // inbound payment routed against the intercept SCID. Surface in the
  // UI so the user knows the net amount they'll receive.
  uint64 jit_fee_msat_quote = 3;

  // 33-byte LSP pubkey hex (for display / verification).
  string lsp_pubkey_hex = 4;
}

// ── RotateCredential (D3 M3) ──────────────────────────────────────────────────

message RotateCredentialRequest {
  // Old macaroon — must be currently valid (chain verifies, not revoked,
  // not expired). Server uses it to authenticate the request and then
  // adds its nonce to revocation with a 30s TTL grace.
  bytes old_macaroon = 1;
}

message RotateCredentialResponse {
  // Freshly-minted macaroon under the same scope as the old one.
  bytes new_macaroon = 1;
  // Convenience: server-derived expiry of the new macaroon, unix seconds.
  // The SDK can also parse this from the macaroon directly.
  int64 expires_at_unix = 2;
}

// ── AdminService (slice 3.3a) ─────────────────────────────────────────────────
//
// Operator-scoped RPCs distinct from the tenant `WalletService`. Used
// by the operator's SDK to install the LSP's Lightning identity at
// runtime (no server-resident seed) and to drive the self-custodial
// JIT channel-funding flow:
//
//   1. RegisterLspIdentity(seed)       — server builds the LSP daemon.
//   2. LspWatchPendingFunding (stream) — server yields parked
//                                        FundingGenerationReady events.
//   3. LspFinalizeFunding(temp_id, tx) — operator signed the funding tx
//                                        from its own BDK wallet; server
//                                        hands it to LDK.
//
// Auth: gated by an `x-wick-admin-secret` metadata header validated
// against the server's `WICK_ADMIN_SECRET` env var. Plain gRPC
// metadata for slice 3.3a; macaroon scope plumbing arrives in 3.3c.
service AdminService {
  // Install the LSP's Lightning identity from the operator's SDK.
  // The 32-byte seed is consumed in-memory only — never persisted on
  // the server. Idempotent on the same seed (re-registration with the
  // matching pubkey is a no-op); errors on a different seed.
  rpc RegisterLspIdentity(RegisterLspIdentityRequest) returns (RegisterLspIdentityResponse);

  // Stream parked FundingGenerationReady events the operator's SDK
  // must sign for. The stream first replays any currently-parked
  // entries, then yields newly-parked entries as the LSP creates JIT
  // channels.
  rpc LspWatchPendingFunding(LspWatchPendingFundingRequest) returns (stream LspPendingFunding);

  // Finalize a parked funding entry by handing the server a fully-
  // signed bitcoin::Transaction. Drains the entry from the funding
  // registry and calls ChannelManager::funding_transaction_generated.
  rpc LspFinalizeFunding(LspFinalizeFundingRequest) returns (LspFinalizeFundingResponse);
}

message RegisterLspIdentityRequest {
  // 32-byte LSP Lightning seed. Same shape as today's LocalKeysManager
  // input. Phase 4 swaps this for a remote-signer URL + attestation.
  bytes lightning_seed = 1;
}

message RegisterLspIdentityResponse {
  // 33-byte compressed SEC1 pubkey hex of the registered LSP.
  string lsp_pubkey_hex = 1;
  // Always true on success — the slot is occupied.
  bool ready = 2;
}

message LspWatchPendingFundingRequest {}

message LspPendingFunding {
  // 32-byte temporary_channel_id LDK assigned to this open.
  bytes temp_channel_id = 1;
  // 33-byte compressed SEC1 counterparty pubkey hex.
  string counterparty_pubkey_hex = 2;
  // Channel capacity in satoshis — exact amount the funding tx must pay.
  uint64 value_sat = 3;
  // Hex-encoded raw 2-of-2 multisig scriptPubKey LDK wants to fund.
  string output_script_hex = 4;
}

message LspFinalizeFundingRequest {
  // 32-byte temp_channel_id from the watch stream.
  bytes temp_channel_id = 1;
  // 33-byte compressed SEC1 counterparty pubkey hex.
  string counterparty_pubkey_hex = 2;
  // Hex-encoded serialised bitcoin::Transaction paying `value_sat` to
  // the `output_script_hex` from the watch event.
  string funding_tx_hex = 3;
}

message LspFinalizeFundingResponse {}

// SignerService — Phase 4 remote signer.
//
// Tenant Lightning keys live exclusively in the SDK. The server's
// `wick-vls::SignerSession` services every LDK signer-trait call by
// dispatching a VLS-protocol frame down this bidi stream and awaiting
// the SDK's reply. Most-recent-wins on reconnect: a fresh `Attach`
// closes any prior session for the same tenant and fails its
// in-flight calls.
//
// Auth: the standard tenant `Authorization: Bearer <token>` header.
// The server resolves the bearer token to a `TenantId` and uses that
// as the `context_id` in the registry.
service SignerService {
  rpc Attach(stream SignerInbound) returns (stream SignerOutbound);
}

// Server → SDK frame. `oneof` envelope so future control frames
// (state-sync watermarks, keepalive) can land without breaking wire
// format.
message SignerOutbound {
  oneof kind {
    // Wire-encoded VLS frame produced by `SignerConnection::dispatch_*_call`:
    //   node:    `[4B req_id BE][0x01][3B reserved][vls_bytes]`
    //   channel: `[4B req_id BE][0x02][3B reserved][8B dbid BE][33B peer_id][vls_bytes]`
    // `vls_bytes = [u16 type BE][data]` — `vls_protocol::msgs::SerBolt::as_vec`.
    bytes vls_call = 1;
    // Phase-4 D1 N2 — opaque Noise_KK handshake/transport bytes. During
    // handshake this carries the responder's reply (`<- e, ee, se`).
    // During transport this carries the AEAD ciphertext of a serialised
    // `AttachInner` envelope (which itself wraps `vls_call`).
    bytes noise_frame = 2;
  }
}

// SDK → server frame.
message SignerInbound {
  oneof kind {
    // Wire-encoded VLS reply: `[4B req_id BE][1B status][body]` — `status=0x00`
    // means success and `body` is the VLS reply bytes; otherwise `body` is a
    // UTF-8 error string. Routed through `SignerConnection::resolve_response`.
    bytes vls_response = 1;
    // Phase-4 D1 N2 — opaque Noise_KK handshake/transport bytes. During
    // handshake this carries the initiator messages (`-> e, es, ss`).
    // During transport this carries the AEAD ciphertext of a serialised
    // `AttachInner` envelope (which wraps a `vls_response`).
    bytes noise_frame = 2;
  }
}

// Phase-4 D1 N2 — inner envelope encrypted inside a `noise_frame` once
// the KK handshake completes. Carries the macaroon alongside the
// VLS payload on every transport frame so the server can re-verify the
// caller's identity (including the `NoiseStaticPk` caveat — see the
// macaroon crate) against the observed Noise static. `seq` is a
// monotonic per-direction counter; the server rejects out-of-order or
// duplicate frames as a defense-in-depth replay check on top of the
// AEAD nonce.
message AttachInner {
  // Serialised user-scoped macaroon (same encoding as the
  // `x-wick-macaroon` header — raw bytes, not hex).
  bytes macaroon = 1;
  // Inner VLS payload. On the SDK→server direction this is the
  // wire-encoded `[4B req_id BE][1B status][body]` reply; on the
  // server→SDK direction it is the wire-encoded VLS call frame.
  bytes vls_payload = 2;
  // Monotonic per-direction sequence number, starting at 1 on the
  // first transport frame.
  uint64 seq = 3;
}
