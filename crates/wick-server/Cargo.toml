[package]
name = "wick-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Multi-tenant ldk-server process. Phase 1: actor model + gRPC."

[lib]
name = "wick_server"
path = "src/lib.rs"

[[bin]]
name = "wick-server"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
wick-core      = { workspace = true }
wick-db        = { workspace = true }
wick-proto     = { workspace = true }
wick-lightning = { workspace = true }
wick-lsp       = { workspace = true }
wick-vls       = { workspace = true }
wick-macaroon  = { workspace = true, features = ["postgres"] }
wick-noise     = { workspace = true }
prost          = { workspace = true }
futures        = { workspace = true }

tokio      = { workspace = true }
tracing    = { workspace = true }
anyhow     = { workspace = true }
serde      = { workspace = true }
dashmap    = { workspace = true }
arc-swap   = { workspace = true }
metrics    = { workspace = true }
parking_lot = { workspace = true }
thiserror   = { workspace = true }
sqlx       = { workspace = true }
tonic      = { workspace = true }
tokio-stream = { workspace = true }
hex        = "0.4"
base64     = "0.22"
bitcoin    = { workspace = true }
sha2       = { workspace = true }
subtle     = "2.6"
rand       = { workspace = true }
uuid       = { workspace = true }
lightning  = { workspace = true }

[dependencies.async-trait]
workspace = true

[dev-dependencies]
tokio = { workspace = true }
proptest = { workspace = true }
